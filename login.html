<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEAR Login Portal</title>
<style>
  /* RESET */
  *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
  
  /* BODY */
  body{ height:100vh; display:flex; justify-content:center; align-items:center; background: radial-gradient(circle at top, #2b1b4a, #120a24, #0a0815); overflow:hidden; }
  
  /* CONTAINER */
  .container{ width:1000px; height:620px; display:flex; border-radius:22px; overflow:hidden; background:rgba(255,255,255,0.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); box-shadow:0 25px 80px rgba(0,0,0,0.6); }
  
  /* LEFT PANEL */
  .left{ width:40%; position:relative; color:white; padding:45px; display:flex; flex-direction:column; justify-content:space-between; background-size:cover; background-position:center; transition:0.4s; }
  
  /* TOP BAR */
  .top{ display:flex; justify-content:space-between; align-items:center; }
  
  /* LOGO */
  .logo{ font-size:28px; font-weight:bold; letter-spacing:4px; color:white; }
  
  /* HOME LINK */
  .index-link{ text-decoration:none; color:white; font-size:12px; padding:6px 12px; border-radius:20px; background:rgba(255,255,255,0.10); }
  
  /* RIGHT PANEL */
  .right{ flex:1; padding:60px; display:flex; flex-direction:column; justify-content:center; color:white; }
  
  /* TITLE */
  .right h1{font-size:32px;margin-bottom:10px;}
  
  /* SUBTEXT */
  .sub{font-size:14px;opacity:0.7;margin-bottom:25px;}
  
  /* ROLE BUTTONS */
  .roles{ display:flex; gap:12px; margin-bottom:25px; }
  .role-btn{ flex:1; padding:14px; border:none; border-radius:12px; background:rgba(255,255,255,0.08); color:white; cursor:pointer; font-weight:bold; }
  .role-btn.active{ background:linear-gradient(90deg,#6366f1,#8b5cf6); }
  
  /* FORM */
  .form-group{margin-bottom:18px;}
  input{ width:100%; padding:14px; border-radius:12px; border:none; outline:none; background:rgba(255,255,255,0.08); color:white; }
  .staff-box{display:none;}
  
  /* LOGIN BUTTON */
  .login-btn{ width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(90deg,#6366f1,#8b5cf6); color:white; font-weight:bold; cursor:pointer; margin-top:10px; }
  
  /* STATUS */
  .status{ margin-top:18px; text-align:center; font-size:12px; opacity:0.6; }
  
  /* ALERT */
  .alert{ position:fixed; top:30px; right:-400px; width:300px; padding:16px; background:rgba(20,20,30,0.95); border-left:4px solid #22c55e; border-radius:10px; transition:0.4s; }
  .alert.show{right:30px;}
</style>
</head>
<body>

<!-- ALERT -->
<div class="alert" id="alertBox">
  <h3 style="color:white;">ACCESS GRANTED</h3>
  <p style="color:rgba(255,255,255,0.7);font-size:13px;">Login successful</p>
</div>

<!-- MAIN CONTAINER -->
<div class="container">
  <!-- LEFT PANEL (DYNAMIC BG) -->
  <div class="left" id="leftPanel">
    <div class="top">
      <div class="logo">WEAR</div>
      <a href="home.html" class="index-link">Home</a>
    </div>
  </div>

  <!-- RIGHT PANEL (FORM) -->
  <div class="right">
    <h1>Login Portal</h1>
    <p class="sub">Select your access type</p>
    
    <!-- ROLE SELECTION -->
    <div class="roles">
      <button class="role-btn active" id="userBtn" onclick="window.selectRole('user')">USER</button>
      <button class="role-btn" id="dispatchBtn" onclick="window.selectRole('dispatch')">DISPATCH</button>
    </div>
    
    <!-- CREDENTIALS -->
    <div class="form-group"><input type="email" id="email" placeholder="Enter email"></div>
    <div class="form-group"><input type="password" id="password" placeholder="Enter password"></div>
    <div class="form-group staff-box" id="staffBox"><input type="text" id="staffId" placeholder="Enter staff number"></div>
    
    <!-- LOGIN ACTION -->
    <button class="login-btn" onclick="window.login()">LOGIN</button>
    <div class="status">Encrypted emergency system active</div>
  </div>
</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyCO9jXDjuNAVG7sqEq7M1vh42bsD_n60XQ",
    authDomain: "wera-5d7af.firebaseapp.com",
    projectId: "wera-5d7af",
    storageBucket: "wera-5d7af.firebasestorage.app",
    messagingSenderId: "975783139434",
    appId: "1:975783139434:web:46ca6c60ee985492421213",
    measurementId: "G-QEFP3J2LPY"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // STATE
  let currentRole = "user";
  const leftPanel = document.getElementById("leftPanel");
  leftPanel.style.backgroundImage = "url('user-image.jpeg')";

  // ROLE HANDLER
  window.selectRole = function(role) {
    currentRole = role;
    document.getElementById("userBtn").classList.remove("active");
    document.getElementById("dispatchBtn").classList.remove("active");

    if(role === "user"){
      document.getElementById("userBtn").classList.add("active");
      document.getElementById("staffBox").style.display = "none";
      leftPanel.style.backgroundImage = "url('user-image.jpeg')";
    } else {
      document.getElementById("dispatchBtn").classList.add("active");
      document.getElementById("staffBox").style.display = "block";
      leftPanel.style.backgroundImage = "url('dis-image.jpeg')";
    }
  }

  // LOGIN VALIDATION
  window.login = async function() {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value.trim();
    const staffId = document.getElementById("staffId").value.trim();

    try {
      const usersRef = collection(db, "wera_users");
      const q = query(usersRef, where("email", "==", email), where("password", "==", password));
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) { alert("Invalid credentials."); return; }

      let account = null;
      querySnapshot.forEach((doc) => { account = doc.data(); });

      if (currentRole === "user") {
        if (account.role !== "user") { alert("Not a user account"); return; }
        localStorage.setItem("session", JSON.stringify({ loggedIn: true, role: "user", email: account.email }));
        showSuccess();
        setTimeout(() => window.location.replace("user.html"), 1000);
      } else {
        if (account.role !== "dispatch") { alert("Not a dispatch account"); return; }
        if (account.staffId !== staffId) { alert("Invalid Staff ID"); return; }
        localStorage.setItem("session", JSON.stringify({ loggedIn: true, role: "dispatch", email: account.email }));
        showSuccess();
        setTimeout(() => window.location.replace("dispatch.html"), 1000);
      }
    } catch (error) {
      console.error("Login Error:", error);
      alert("System error. Check your database connection.");
    }
  }

  // SUCCESS NOTIFICATION
  function showSuccess(){
    const alertBox = document.getElementById("alertBox");
    alertBox.classList.add("show");
    setTimeout(() => alertBox.classList.remove("show"), 2000);
  }
</script>

</body>
</html>
